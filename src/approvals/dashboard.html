<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pyloros approvals</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem; color: #222; max-width: 980px; }
      h1 { font-size: 1.4rem; margin: 0 0 1rem; }
      h2 { font-size: 1.1rem; margin: 1.5rem 0 .5rem; color: #444; border-bottom: 1px solid #e0e0e0; padding-bottom: .25rem; }
      .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
      .bar .status { color: #666; margin-left: auto; font-size: 0.9em; }
      button { font: inherit; padding: .35rem .8rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; }
      button:hover { background: #f5f5f5; }
      .empty { color: #888; padding: .75rem; border: 1px dashed #ccc; text-align: center; border-radius: 4px; margin-bottom: 1rem; }
      .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; background: #fafafa; }
      .card h3 { font-size: 1rem; margin: 0 0 .5rem; }
      .reason { color: #555; margin-bottom: .5rem; font-style: italic; }
      .triggered { color: #666; font-size: .85em; margin-bottom: .75rem; }
      .controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
      .controls select, .controls input, .controls textarea { font: inherit; padding: .3rem; border: 1px solid #ccc; border-radius: 3px; }
      .deny-msg { flex: 1; min-width: 220px; height: 2.2em; resize: vertical; }
      .rule-toml { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: .85em; padding: .5rem; border: 1px solid #ddd; border-radius: 4px; min-height: 9em; resize: vertical; }
      .parse-error { color: #c13030; font-size: .85em; margin-top: .25rem; white-space: pre-wrap; font-family: ui-monospace, monospace; }
      .approve { background: #1b8f3a; color: #fff; border-color: #1b8f3a; }
      .deny { background: #c13030; color: #fff; border-color: #c13030; }
      .revoke { background: #fff; color: #c13030; border-color: #c13030; }
      .small { background: #fff; padding: .25rem .5rem; font-size: .85em; }
      .resolved { opacity: 0.55; }
      .resolved .controls { display: none; }
      .tag { display: inline-block; padding: 0 .4rem; border-radius: 3px; font-size: .78em; vertical-align: middle; margin-left: .4rem; }
      .tag.approved { background: #d5f0dd; color: #175f27; }
      .tag.denied { background: #f5d5d5; color: #772020; }
      .tag.lifetime { background: #e5e5f0; color: #333; }
      .perm-bar { background: #fff7e0; border: 1px solid #d6c590; border-radius: 6px; padding: .6rem .8rem; margin-bottom: 1rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
      .perm-bar.active { background: #ffeed0; border-color: #c9a350; }
      .perm-status { font-weight: 600; }
      .audit-list { font-family: ui-monospace, monospace; font-size: .85em; max-height: 18em; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 0; margin-bottom: .5rem; background: #fff; }
      .audit-row { padding: .25rem .5rem; border-bottom: 1px solid #f0f0f0; display: flex; gap: .5rem; align-items: baseline; }
      .audit-row:last-child { border-bottom: 0; }
      .audit-row .ts { color: #888; }
      .audit-row .method { font-weight: 600; min-width: 4em; }
      .audit-row .url { color: #333; flex: 1; word-break: break-all; }
      .audit-row .reason { color: #666; font-size: .85em; font-style: normal; margin: 0; }
      .audit-row.blocked .method { color: #c13030; }
      .audit-row.allowed .method { color: #1b8f3a; }
      .audit-row.permitted .method { color: #b07a18; }
      .audit-row .createrule { margin-left: auto; }
      label.inline { font-size: .9em; color: #555; }
      .filebrk { color: #888; font-size: .85em; margin-top: .25rem; }
      .editor-row { display: flex; gap: .5rem; align-items: flex-end; margin-bottom: .25rem; }
      .editor-row textarea { flex: 1; }
      .editor-row .editor-buttons { display: flex; flex-direction: column; gap: .25rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { html, render, useState, useEffect, useRef } from './preact.js';

      // ---------- helpers ----------
      function fmtRemaining(secs) {
        if (secs == null) return '';
        if (secs < 60) return `${secs}s`;
        const m = Math.floor(secs / 60);
        if (m < 60) return `${m}m ${secs % 60}s`;
        const h = Math.floor(m / 60);
        return `${h}h ${m % 60}m`;
      }

      function postJson(path, body) {
        return fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      }

      async function fetchSuggestForRules(rules) {
        const resp = await postJson('/rules/suggest', { rules });
        if (!resp.ok) return rules.map(r => '# ' + JSON.stringify(r)).join('\n');
        return (await resp.json()).toml;
      }

      async function fetchSuggestForAudit(entry) {
        const resp = await postJson('/rules/suggest', { audit: entry });
        if (!resp.ok) return '# (server suggestion failed)\n';
        return (await resp.json()).toml;
      }

      /** Parse TOML server-side, then run `submit(rules)`. Returns an error string or null. */
      async function parseThen(toml, submit) {
        const parsed = await postJson('/rules/parse', { toml });
        if (!parsed.ok) return await parsed.text();
        const { rules } = await parsed.json();
        const resp = await submit(rules);
        return resp.ok ? null : await resp.text();
      }

      // ---------- permissive bar ----------
      function PermissiveBar({ permissive, deadline }) {
        const [, setTick] = useState(0);
        useEffect(() => {
          const t = setInterval(() => setTick(n => n + 1), 1000);
          return () => clearInterval(t);
        }, []);
        const durRef = useRef(null);

        const enable = async () => {
          const resp = await postJson('/permissive', { duration_secs: parseInt(durRef.current.value, 10) });
          if (!resp.ok) alert(`Enable failed: ${resp.status} ${await resp.text()}`);
        };
        const disable = async () => {
          const resp = await postJson('/permissive', { duration_secs: 0 });
          if (!resp.ok) alert(`Disable failed: ${resp.status} ${await resp.text()}`);
        };

        const active = !!permissive.active;
        const remaining = deadline
          ? Math.max(0, Math.round((deadline - Date.now()) / 1000))
          : (permissive.remaining_secs ?? 0);

        return html`
          <div class=${'perm-bar' + (active ? ' active' : '')} id="perm-bar">
            <span class="perm-status" id="perm-status">
              ${active ? `permissive mode: ON — expires in ${fmtRemaining(remaining)}` : 'permissive mode: off'}
            </span>
            <label class="inline">duration:
              <select id="perm-duration" ref=${durRef}>
                <option value="300">5 min</option>
                <option value="900" selected>15 min</option>
                <option value="3600">1 hour</option>
              </select>
            </label>
            ${active
              ? html`<button id="perm-disable" onClick=${disable}>Disable</button>`
              : html`<button id="perm-enable" onClick=${enable}>Enable</button>`}
          </div>
        `;
      }

      // ---------- pending approvals ----------
      function PendingCard({ a }) {
        // Server-formatted TOML, fetched once per approval; edits live here too.
        const [toml, setToml] = useState('');
        const [error, setError] = useState(null);
        const [ttl, setTtl] = useState(a.suggested_ttl || 'permanent');
        const msgRef = useRef(null);

        useEffect(() => { fetchSuggestForRules(a.rules || []).then(setToml); }, [a.id]);

        const approve = async () => {
          setError(await parseThen(toml, rules =>
            postJson(`/approvals/${encodeURIComponent(a.id)}/decision`, {
              action: 'approve', ttl, rules_applied: rules,
            })));
        };
        const deny = async () => {
          const m = msgRef.current.value.trim();
          const resp = await postJson(`/approvals/${encodeURIComponent(a.id)}/decision`, {
            action: 'deny', message: m || null,
          });
          if (!resp.ok) alert(`Deny failed: ${resp.status} ${await resp.text()}`);
        };

        const resolved = a.status && a.status !== 'pending';
        return html`
          <div class=${'card' + (resolved ? ' resolved' : '')} data-id=${a.id}>
            <h3>
              ${a.id}
              ${a.status === 'approved' && html`<span class="tag approved">approved</span>`}
              ${a.status === 'denied' && html`<span class="tag denied">denied</span>`}
            </h3>
            ${a.reason && html`<div class="reason">${a.reason}</div>`}
            ${a.triggered_by && html`
              <div class="triggered">triggered by <code>${a.triggered_by.method} ${a.triggered_by.url}</code></div>`}
            <div class="editor-row">
              <textarea class="rule-toml" value=${toml} onInput=${e => setToml(e.target.value)}></textarea>
            </div>
            ${error && html`<div class="parse-error">${error}</div>`}
            <div class="controls">
              <label class="inline">Lifetime:
                <${LifetimeSelect} value=${ttl} onChange=${setTtl} />
              </label>
              <textarea class="deny-msg" ref=${msgRef} placeholder="Deny message (optional)"></textarea>
              <button class="approve" onClick=${approve}>Approve</button>
              <button class="deny" onClick=${deny}>Deny</button>
            </div>
          </div>
        `;
      }

      function LifetimeSelect({ value, onChange }) {
        return html`
          <select value=${value} onChange=${e => onChange(e.target.value)}>
            <option value="one_hour">1 hour</option>
            <option value="one_day">1 day</option>
            <option value="permanent">permanent</option>
          </select>
        `;
      }

      // ---------- active timeboxed rules ----------
      function ActiveCard({ rule }) {
        const revoke = async () => {
          const resp = await fetch(`/approvals/${encodeURIComponent(rule.approval_id)}/rules`, { method: 'DELETE' });
          if (!resp.ok) alert(`Revoke failed: ${resp.status} ${await resp.text()}`);
        };
        return html`
          <div class="card">
            <h3>
              ${rule.approval_id}
              <span class="tag lifetime">${rule.lifetime} — ${fmtRemaining(rule.remaining_secs)} left</span>
            </h3>
            <textarea class="rule-toml" readonly value=${rule.toml}></textarea>
            <div class="controls"><button class="revoke" onClick=${revoke}>Revoke</button></div>
          </div>
        `;
      }

      // ---------- audit list ----------
      // Events where "Create rule" makes sense: a real request that
      // either was blocked, was let through only because permissive
      // mode was on (so the user likely wants a permanent rule), or
      // failed auth.
      const RULE_EVENTS = new Set(['request_blocked', 'request_permitted', 'auth_failed']);

      function AuditRow({ entry: e, onCreateRule }) {
        const cls = e.event === 'request_blocked' ? 'blocked'
                  : e.event === 'request_permitted' ? 'permitted'
                  : e.event === 'request_allowed' ? 'allowed' : '';
        const ts = (e.timestamp || '').replace('T', ' ').replace('Z', '');
        const body = e.event === 'permissive_enabled'
          ? html`<span class="method">PERMISSIVE ON</span>
                 <span class="url">duration=${e.permissive_duration_secs}s source=${e.permissive_source || ''}</span>`
          : e.event === 'permissive_disabled'
          ? html`<span class="method">PERMISSIVE OFF</span><span class="url">source=${e.permissive_source || ''}</span>`
          : html`<span class="method">${e.method}</span><span class="url">${e.url}</span>`;
        return html`
          <div class=${`audit-row ${cls}`}>
            <span class="ts">${ts}</span>
            ${body}
            ${e.reason && html`<span class="reason">${e.reason}</span>`}
            ${RULE_EVENTS.has(e.event) && html`
              <button class="small createrule" onClick=${() => onCreateRule(e)}>Create rule</button>`}
          </div>
        `;
      }

      // ---------- create-rule editor (inserted above the audit list) ----------
      function CreateRuleCard({ entry, onClose }) {
        const [toml, setToml] = useState('');
        const [error, setError] = useState(null);
        const [ttl, setTtl] = useState('permanent');

        useEffect(() => { fetchSuggestForAudit(entry).then(setToml); }, []);

        const add = async () => {
          const err = await parseThen(toml, rules => postJson('/rules', { rules, ttl }));
          if (err === null) onClose(); else setError(err);
        };

        return html`
          <div class="card">
            <h3>Create rule from blocked request</h3>
            <div class="triggered"><code>${entry.method} ${entry.url}</code></div>
            <textarea class="rule-toml" value=${toml} onInput=${e => setToml(e.target.value)}></textarea>
            ${error && html`<div class="parse-error">${error}</div>`}
            <div class="controls">
              <label class="inline">Lifetime:
                <${LifetimeSelect} value=${ttl} onChange=${setTtl} />
              </label>
              <button class="approve" onClick=${add}>Add rule</button>
              <button class="cancel" onClick=${onClose}>Cancel</button>
            </div>
          </div>
        `;
      }

      // ---------- notifications ----------
      function notify(a) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const body = (a.rules || []).map(r => JSON.stringify(r)).join('\n')
          + (a.reason ? `\n— ${a.reason}` : '');
        try {
          const n = new Notification('pyloros approval requested', {
            body, tag: a.id, requireInteraction: true,
          });
          n.onclick = () => { window.focus(); n.close(); };
        } catch (e) { console.warn('Notification failed', e); }
      }

      function NotifyButton() {
        const granted = 'Notification' in window && Notification.permission === 'granted';
        const [label, setLabel] = useState(granted ? 'Notifications on' : 'Enable notifications');
        const [disabled, setDisabled] = useState(granted);

        const click = async () => {
          if (!('Notification' in window)) {
            setLabel('Notifications unsupported');
            setDisabled(true);
            return;
          }
          const res = await Notification.requestPermission();
          setLabel(res === 'granted' ? 'Notifications on' : `Notifications: ${res}`);
          setDisabled(true);
        };
        return html`<button id="notify-btn" disabled=${disabled} onClick=${click}>${label}</button>`;
      }

      // ---------- app ----------
      const EMPTY = {
        pending: [],              // ApprovalRequest[]
        active: [],               // ActiveApprovalSnapshot[]
        permissive: { active: false, remaining_secs: null },
        permissiveDeadline: null, // millis when the override expires (live countdown)
        recent_blocked: [],
        recent_all: [],
        stream: 'connecting…',
        drafts: [],               // open create-rule editors: {key, entry}[]
      };

      function App() {
        const [st, setSt] = useState(EMPTY);
        const [showAllowed, setShowAllowed] = useState(false);
        const allowedRef = useRef(null);
        const patch = p => setSt(s => ({ ...s, ...(typeof p === 'function' ? p(s) : p) }));

        // Browsers preserve form state across reloads, so on F5 the box may
        // already be checked before any of our code runs.
        useEffect(() => { setShowAllowed(allowedRef.current.checked); }, []);

        useEffect(() => {
          const es = new EventSource('/events');
          es.onopen = () => patch({ stream: 'connected' });
          es.onerror = () => patch({ stream: 'disconnected — retrying' });
          es.onmessage = ev => handle(JSON.parse(ev.data));
          return () => es.close();
        }, []);

        function handle(msg) {
          if (msg.event === 'snapshot') {
            const p = msg.permissive || { active: false };
            patch({
              pending: msg.pending || [],
              active: msg.active || [],
              permissive: p,
              permissiveDeadline: p.active && p.remaining_secs != null
                ? Date.now() + p.remaining_secs * 1000 : null,
              recent_blocked: msg.recent_blocked || [],
              recent_all: msg.recent_all || [],
            });
          } else if (msg.event === 'pending') {
            patch(s => ({ pending: upsertById(s.pending, msg.approval) }));
            notify(msg.approval);
          } else if (msg.event === 'resolved') {
            // `msg.status` is a nested ApprovalStatus object
            // ({status, rules_applied?, ttl?, message?}), whereas the
            // snapshot/pending shapes flatten it. Normalize to the flat
            // form the rest of the code expects (a.status is the string
            // discriminant used for the approved/denied tag).
            const st2 = msg.status || {};
            patch(s => ({
              pending: s.pending.map(a => a.id === msg.id
                ? { ...a, status: st2.status, rules_applied: st2.rules_applied, message: st2.message }
                : a),
            }));
            setTimeout(() => patch(s => ({ pending: s.pending.filter(a => a.id !== msg.id) })), 3000);
          } else if (msg.event === 'permissive_changed') {
            patch({
              permissive: msg.status,
              permissiveDeadline: msg.status.active && msg.status.remaining_secs != null
                ? Date.now() + msg.status.remaining_secs * 1000 : null,
            });
          } else if (msg.event === 'active_rules_changed') {
            patch({ active: msg.rules || [] });
          } else if (msg.event === 'audit') {
            const e = msg.entry;
            const blocked = ['request_blocked', 'auth_failed', 'request_permitted',
                             'permissive_enabled', 'permissive_disabled'].includes(e.event);
            patch(s => ({
              recent_all: upsertAudit(s.recent_all, e),
              recent_blocked: blocked ? upsertAudit(s.recent_blocked, e) : s.recent_blocked,
            }));
          }
        }

        const openDraft = entry => patch(s => ({ drafts: [...s.drafts, { key: Date.now() + Math.random(), entry }] }));
        const closeDraft = key => patch(s => ({ drafts: s.drafts.filter(d => d.key !== key) }));

        const activeRules = st.active.filter(r => r.remaining_secs != null);
        const auditItems = (showAllowed ? st.recent_all : st.recent_blocked).slice(0, 100);

        return html`
          <h1>pyloros approvals</h1>
          <div class="bar">
            <${NotifyButton} />
            <span class="status" id="stream-status">${st.stream}</span>
          </div>

          <${PermissiveBar} permissive=${st.permissive} deadline=${st.permissiveDeadline} />

          <h2>Pending approvals</h2>
          <div id="pending-list">
            ${st.pending.length === 0
              ? html`<div class="empty">No pending approvals.</div>`
              : st.pending.map(a => html`<${PendingCard} key=${a.id} a=${a} />`)}
          </div>

          <h2>Active timeboxed rules</h2>
          <div id="active-list">
            ${activeRules.length === 0
              ? html`<div class="empty">No timeboxed rules active.</div>`
              : activeRules.map(r => html`<${ActiveCard} key=${r.approval_id} rule=${r} />`)}
          </div>

          <h2>Audit log
            <label class="inline" style="font-weight: normal; margin-left: .5rem;">
              <input type="checkbox" id="audit-include-allowed" ref=${allowedRef}
                     onChange=${e => setShowAllowed(e.target.checked)} />
              also show allowed (rule-matched) requests
            </label>
          </h2>
          ${st.drafts.map(d => html`
            <${CreateRuleCard} key=${d.key} entry=${d.entry} onClose=${() => closeDraft(d.key)} />`)}
          <div id="audit-list">
            ${auditItems.length === 0
              ? html`<div class="empty">No audit entries.</div>`
              : html`<div class="audit-list">
                  ${auditItems.map((e, i) => html`
                    <${AuditRow} key=${`${e.timestamp}|${e.url}|${e.event}|${i}`} entry=${e} onCreateRule=${openDraft} />`)}
                </div>`}
          </div>
          <div class="filebrk">Older entries available in the audit log file on disk.</div>
        `;
      }

      function upsertById(list, a) {
        const i = list.findIndex(x => x.id === a.id);
        if (i < 0) return [...list, a];
        const out = list.slice();
        out[i] = a;
        return out;
      }

      // The server re-fires the SSE audit callback when an existing entry is
      // mutated (e.g. redirect_target attached after the response arrives).
      // Replace in place if we already have an entry with the same
      // timestamp+url+event; otherwise prepend.
      function upsertAudit(list, e) {
        const i = list.findIndex(x => x.timestamp === e.timestamp && x.url === e.url && x.event === e.event);
        if (i >= 0) {
          const out = list.slice();
          out[i] = e;
          return out;
        }
        return [e, ...list].slice(0, 500);
      }

      render(html`<${App} />`, document.getElementById('app'));
    </script>
  </body>
</html>
